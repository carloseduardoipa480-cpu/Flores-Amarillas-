<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- VISTA PREVIA PARA WHATSAPP -->
  <title>Una Sorpresa Para Ti 🌼❤️</title>
  <meta property="og:title" content="Tengo una sorpresa para ti 🌼❤️" />
  <meta property="og:description" content="Haz clic aquí para ver tu detalle de Flores Amarillas ✨" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1591886960571-74d43a9d4166?q=80&w=600" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#ffde59">

  <style>
    :root {
      --bg-color: #0b0d19;
      --yellow-primary: #ffde59;
      --yellow-glow: #ff914d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1a1c2e 0%, var(--bg-color) 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
    }

    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      flex-grow: 1;
      transition: opacity 0.8s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: var(--yellow-primary);
      text-shadow: 0 0 10px rgba(255, 222, 89, 0.5);
    }

    p {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 1.5rem;
    }

    .btn {
      background: linear-gradient(135deg, var(--yellow-primary), var(--yellow-glow));
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 222, 89, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 222, 89, 0.7);
    }

    /* Árbol de Corazón SVG */
    .tree-container {
      width: 100%;
      max-width: 320px;
      margin: 1rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: growTree 2s ease-out forwards;
    }

    .tree-svg {
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(255, 222, 89, 0.3));
    }

    @keyframes growTree {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .lyrics-container {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
    }

    .lyric-line {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--yellow-primary);
      text-shadow: 0 0 8px rgba(255, 222, 89, 0.6);
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="container">
    <!-- PANTALLA INICIAL -->
    <div id="start-screen" class="screen">
      ✨ 🌼 ✨
      <h1>Hola ❤️</h1>
      <p>Tengo una sorpresa especial para ti...</p>
      <button class="btn" id="start-btn">DESCUBRIR ❤️</button>
    </div>

    <!-- PANTALLA PRINCIPAL CON ÁRBOL DE CORAZÓN -->
    <div id="main-screen" class="screen hidden">
      <div class="tree-container">
        <!-- SVG del árbol en forma de corazón con flores amarillas -->
        <svg class="tree-svg" viewBox="0 0 300 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Tronco -->
          <path d="M140 310 L160 310 L156 220 C156 220 170 180 150 160 C130 180 144 220 144 220 L140 310 Z" fill="#6d4c41"/>
          
          <!-- Hojas/Grama base -->
          <circle cx="150" cy="140" r="90" fill="#fbc02d" opacity="0.2"/>
          
          <!-- Grupo de Corazón de Flores Amarillas -->
          <g id="flower-heart">
            <!-- Capa base de corazón -->
            <path d="M150 70 C120 20 60 30 60 90 C60 140 150 200 150 200 C150 200 240 140 240 90 C240 30 180 20 150 70 Z" fill="#ffd54f"/>
            
            <!-- Floripondios / Girasoles detallados dispersos -->
            <!-- Centro -->
            <circle cx="150" cy="90" r="12" fill="#e65100"/>
            <circle cx="150" cy="90" r="10" fill="#fff59d"/>
            <!-- Izquierda arriba -->
            <circle cx="110" cy="70" r="14" fill="#ffb300"/>
            <circle cx="110" cy="70" r="6" fill="#3e2723"/>
            <!-- Derecha arriba -->
            <circle cx="190" cy="70" r="14" fill="#ffb300"/>
            <circle cx="190" cy="70" r="6" fill="#3e2723"/>
            <!-- Izquierda centro -->
            <circle cx="90" cy="110" r="15" fill="#fbc02d"/>
            <circle cx="90" cy="110" r="7" fill="#4e342e"/>
            <!-- Derecha centro -->
            <circle cx="210" cy="110" r="15" fill="#fbc02d"/>
            <circle cx="210" cy="110" r="7" fill="#4e342e"/>
            <!-- Abajo pico del corazón -->
            <circle cx="150" cy="150" r="13" fill="#ffa000"/>
            <circle cx="150" cy="150" r="5" fill="#3e2723"/>
            
            <!-- Detalles de minitopos de flores -->
            <circle cx="130" cy="50" r="8" fill="#ffe082"/><circle cx="170" cy="50" r="8" fill="#ffe082"/>
            <circle cx="100" cy="90" r="9" fill="#ffd54f"/><circle cx="200" cy="90" r="9" fill="#ffd54f"/>
            <circle cx="125" cy="120" r="10" fill="#ffb300"/><circle cx="175" cy="120" r="10" fill="#ffb300"/>
            <circle cx="140" cy="170" r="8" fill="#fbc02d"/><circle cx="160" cy="170" r="8" fill="#fbc02d"/>
          </g>
        </svg>
      </div>

      <div class="lyrics-container">
        <div id="lyric" class="lyric-line">♪ Flores Amarillas - Floricienta ♪</div>
      </div>

      <div style="margin-top: 1rem;">
        <p>Gracias por estar en mi vida ❤️</p>
      </div>

     <audio id="audio" preload="auto" crossorigin="anonymous" src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>
    
    </div>
  </div>

  <script>
    // Estrellas de fondo
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = `${Math.random() * 3 + 1}px`;
      star.style.height = star.style.width;
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDuration = `${Math.random() * 3 + 2}s`;
      starsContainer.appendChild(star);
    }

    // Tiempos de letra
    const lyricsData = [
      { time: 0, text: "♪ (Intro Instrumental) ♪" },
      { time: 15, text: "Él la estaba esperando con una flor amarilla..." },
      { time: 22, text: "Ella sabía que él sabía que algún día pasaría..." },
      { time: 29, text: "Que vendria a buscarla con sus flores amarillas..." },
      { time: 38, text: "No te apures, no detengas el instante..." },
      { time: 45, text: "El encuentro está planeado de antes..." },
      { time: 52, text: "Y la espera no fue en vano, ya sabías que era para ti..." }
    ];

    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const mainScreen = document.getElementById('main-screen');
    const audio = document.getElementById('audio');
    const lyricDisplay = document.getElementById('lyric');

    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');

      // Forzar la reproducción con promesa para asegurar permisos del navegador
      audio.play().then(() => {
        console.log("Audio reproduciendo con éxito");
      }).catch(error => {
        console.log("Error al reproducir audio:", error);
      });
    });

    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      let currentText = lyricDisplay.innerText;

      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          currentText = lyricsData[i].text;
        }
      }

      lyricDisplay.innerText = currentText;
    });
  </script>
</body>
</html>
